name: release

# Publishes a GitHub release when a version tag is pushed:
#   git tag -a v0.2.0 -m "depwhy v0.2.0" && git push origin v0.2.0
# Tags with a pre-release suffix (v0.2.0-rc.1) are published as pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A tag on a red commit must not publish anything.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...

  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the changelog needs history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Always build and scan with the newest patched toolchain: the binary embeds
          # the Go standard library (including net/http and TLS).
          go-version: stable
          check-latest: true
          cache: true
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # Publishes the apt repository from the .deb files of every stable release (see
  # apt.yml). Pre-release tags (v1.0.0-rc.1) do not update it.
  apt:
    needs: goreleaser
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/apt.yml
    secrets: inherit

  # Publishes the npm launcher package (npm/) at the tag's version, with
  # provenance, then installs it from the registry as a smoke test. Needs the
  # NPM_TOKEN secret; without it the job is skipped with a warning. Pre-release
  # tags are not published.
  npm:
    needs: goreleaser
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: publish token present?
        id: token
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::NPM_TOKEN is not set; the npm package was not published."
          fi
      - if: steps.token.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: steps.token.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: test, version and publish
        if: steps.token.outputs.enabled == 'true'
        working-directory: npm
        run: |
          npm test
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          cp ../LICENSE .
          npm publish --access public --provenance
      - name: smoke test the published package
        if: steps.token.outputs.enabled == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A new package can take several minutes to show up (v0.2.3 took about 8).
          for attempt in $(seq 1 40); do
            if out=$(npx --yes "@kaitlynbassford/depwhy@${version}" --version 2>&1); then
              echo "$out"
              test "$out" = "depwhy ${version}"
              exit 0
            fi
            echo "attempt ${attempt} failed: ${out}"; sleep 15
          done
          exit 1

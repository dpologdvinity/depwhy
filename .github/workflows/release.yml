name: release

# Publishes a GitHub release when a version tag is pushed:
#   git tag -a v0.2.0 -m "depwhy v0.2.0" && git push origin v0.2.0
# Tags with a pre-release suffix (v0.2.0-rc.1) are published as pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A tag on a red commit must not publish anything.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...

  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the changelog needs history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Always build and scan with the newest patched toolchain: the binary embeds
          # the Go standard library (including net/http and TLS).
          go-version: stable
          check-latest: true
          cache: true
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # Publishes the apt repository from the .deb files of every stable release (see
  # apt.yml). Pre-release tags (v1.0.0-rc.1) do not update it.
  apt:
    needs: goreleaser
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/apt.yml
    secrets: inherit

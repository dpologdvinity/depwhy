version: 2

builds:
  - main: ./main.go
    binary: depwhy
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/dpologdvinity/depwhy/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

release:
  # v0.2.0-rc.1 style tags are published as pre-releases.
  prerelease: auto

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore\\(deps\\)"

# Publishes Casks/depwhy.rb to the shared tap (dpologdvinity/homebrew-tap) on
# release. The tap holds packages for other projects too; GoReleaser only touches
# its own file. The token is the repository secret HOMEBREW_TAP_GITHUB_TOKEN.
# (A cask is how Homebrew expects pre-built binaries; "brews" is deprecated.)
homebrew_casks:
  - name: depwhy
    repository:
      owner: dpologdvinity
      name: homebrew-tap
      token: '{{ with index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}{{ . }}{{ end }}'
    homepage: https://github.com/dpologdvinity/depwhy
    description: Explains why a package is in your dependency tree, from the lockfile, offline
    # Pre-releases (v0.2.0-rc.1) do not update the tap, and neither does a run
    # without the token (it expired or is unset): the release itself must not fail.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}auto{{ else }}true{{ end }}'
    hooks:
      post:
        # The binary is not notarized; drop the macOS quarantine flag after install.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/depwhy"]
          end

# Linux packages. The .deb files are what the apt repository serves (see
# scripts/build-apt-repo.sh and the "apt" job in .github/workflows/release.yml);
# .rpm and .apk are attached to the release for other distributions.
nfpms:
  - id: packages
    package_name: depwhy
    formats: [deb, rpm, apk]
    maintainer: dpologdvinity <dpologdvinity@users.noreply.github.com>
    homepage: https://github.com/dpologdvinity/depwhy
    description: Explains why a package is in your dependency tree, from the lockfile.
    license: MIT
    section: devel
    bindir: /usr/bin
